name: gas_monitor_app
description: Sistema de Detección y Monitoreo de Gas IoT con Flutter
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Gestión de estado
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Comunicación MQTT
  mqtt_client: ^10.0.0
  
  # Base de datos
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Almacenamiento
  shared_preferences: ^2.2.2
  
  # Notificaciones
  flutter_local_notifications: ^16.3.0
  workmanager: ^0.5.1
  
  # Gráficos y UI
  fl_chart: ^0.66.0
  syncfusion_flutter_gauges: ^24.1.41
  google_fonts: ^6.1.0
  
  # Utilidades
  crypto: ^3.0.3
  uuid: ^4.3.3
  intl: ^0.18.1
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
